version: 2

project_name: swarmcli

before:
  hooks:
    - go mod download
    - go mod verify

release:
  prerelease: auto
  draft: false
  use_existing_draft: true

env:
  - CGO_ENABLED=0

builds:
  # Every build carries the same post hook: check-oss-artefact.sh runs on each
  # of the binaries actually being published, rather than on a stand-in built
  # somewhere else. What it asserts is what the -oss name claims — the main
  # module is this repository and nothing private is linked. ci.yml runs the
  # same script on every change, so it is not a gate that only ever fires on a
  # tag.
  - id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - 6
      - 7
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/v2/charts.engineVersion={{.Version}}
    main: .
    hooks:
      post:
        - ./scripts/check-oss-artefact.sh "{{ .Path }}"

  - id: osx
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/v2/charts.engineVersion={{.Version}}
    main: .
    hooks:
      post:
        - ./scripts/check-oss-artefact.sh "{{ .Path }}"

  - id: windows
    goos:
      - windows
    goarch:
      - amd64
      - arm64
      - 386
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/v2/charts.engineVersion={{.Version}}
    main: .
    hooks:
      post:
        - ./scripts/check-oss-artefact.sh "{{ .Path }}"

  - id: freebsd
    goos:
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/v2/charts.engineVersion={{.Version}}
    main: .
    hooks:
      post:
        - ./scripts/check-oss-artefact.sh "{{ .Path }}"

archives:
  # `_oss` at the end, not `swarmcli-oss` at the front. The plain name belongs to
  # the merged artefact, which is built from the private swarmcli-be wrapper and
  # published into this repository's releases — so both pipelines write into the
  # same GitHub release, and leaving the plain name here would have them
  # overwrite each other's archives with whichever finished last. The two
  # produce identically-named assets today, ten for ten.
  #
  # Where the qualifier sits decides what a release page shows first. GitHub
  # renders assets sorted by lower(name) in codepoint order — upload order and
  # which pipeline finished last do not enter into it — so a `swarmcli-oss_`
  # prefix put all eleven Apache-2.0 archives above every merged one (`-` is
  # 0x2D, `_` is 0x5F). The releases *index* shows only the first ten assets of
  # a release behind "Show all N assets", which meant the default artefact was
  # not on that page at all. As a suffix, `.` (0x2E) precedes `_` (0x5F), so
  # each merged archive sorts immediately above its -oss twin and the first
  # artefact row is the default build. Verified by upload rather than reasoned
  # about: probe assets list `probe_Linux_x86_64.tar.gz` before
  # `probe_Linux_x86_64_oss.tar.gz` whatever order they are uploaded in.
  #
  # A prefixed `swarmcli_oss_` would NOT do this: `o` sorts after `l` but before
  # `w`, landing the whole -oss set between the merged Linux and Windows
  # archives.
  #
  # The binary *inside* is still `swarmcli`, and `project_name` is deliberately
  # untouched: the four builds below declare no `binary:` field, so it defaults
  # to the project name, and universal_binaries reads it too. Renaming the
  # project would rename the executable and break the Homebrew cask's
  # `binary "swarmcli"`, Scoop's `bin`, swarmcli-charts' `tar xzf … swarmcli`,
  # and every documented invocation. What tells the artefacts apart is what the
  # build says about itself — see docs/editions.md.
  - id: oss
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}_oss
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

universal_binaries:
  - id: darwin-universal
    ids:
      - osx
    replace: true
    name_template: "{{ .ProjectName }}"

# One word longer, for the same reason the archives are. A release carries two
# sets of artefacts, and a single `checksums.txt` would be the one file in which
# the two pipelines silently disagree — the second run to finish replacing the
# first's manifest, leaving half the release unverified by the file that claims
# to cover it. The merged pipeline writes `checksums-merged.txt`; neither side
# takes the unqualified name, so no checksum file in a release is ambiguous
# about which artefacts it verified.
checksum:
  name_template: 'checksums-oss.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

# Homebrew tap (cask)
homebrew_casks:
  # `swarmcli-oss`, not `swarmcli`: the plain cask is written by the merged
  # pipeline. Both install an executable called `swarmcli`, so they conflict.
  - name: swarmcli-oss
    # Don't update the public tap for prereleases (-rc) or snapshots; GA only.
    skip_upload: "auto"
    ids:
      - oss
    binaries:
      - swarmcli
    repository:
      owner: Eldara-Tech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://swarmcli.io"
    description: "Docker Swarm TUI management tool (Apache-2.0 build)"
    commit_author:
      name: Eldara Tech
      email: hello@eldara.io
    conflicts:
      - cask: swarmcli
    # GoReleaser binaries are not Apple-notarized; strip the Gatekeeper
    # quarantine xattr on install so the CLI runs without a security prompt.
    # A custom_block rather than `hooks.post.install`, which goreleaser renders
    # as a `postflight` block — deprecated since Homebrew 6.0.16. Install steps
    # (Homebrew >= 5.1.14) have no staged_path token; `chdir: "."` is it.
    custom_block: |
      on_macos do
        postflight_steps do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "swarmcli"], chdir: "."
        end
      end

# Scoop bucket for Windows
scoops:
  - name: swarmcli-oss
    # Don't update the public bucket for prereleases (-rc) or snapshots; GA only.
    skip_upload: "auto"
    ids:
      - oss
    repository:
      owner: Eldara-Tech
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    commit_author:
      name: Eldara Tech
      email: hello@eldara.io
    homepage: "https://swarmcli.io"
    description: "Docker Swarm TUI management tool"
    license: "Apache-2.0"
    post_install:
      - "Write-Host 'swarmcli installed successfully!' -ForegroundColor Green"

# Docker images (multi-arch; replaces the deprecated dockers + docker_manifests)
dockers_v2:
  - id: swarmcli
    images:
      - "eldaratech/swarmcli"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      # -oss, and no moving tag at all.
      #
      # The unsuffixed tags and :latest belong to the merged artefact, which is
      # built from the private swarmcli-be wrapper and pushed to this same
      # Docker Hub repository. Two pipelines writing eldaratech/swarmcli:v1.14.0
      # would leave an operator with whichever finished last. So a tag pushed
      # here on its own no longer moves :latest — stated in RELEASING.md rather
      # than discovered.
      #
      # `{{ .Tag }}` keeps the leading `v`, which is what every one of this
      # image's 59 published tags uses and what swarmcli-charts' docs pin.
      # swarmcli-cd uses bare semver instead, because its Helm chart defaults
      # image.tag to appVersion; nothing here has that constraint.
      #
      # No moving :oss tag either. An Apache-2.0-only deployment pins a version,
      # which is what an air-gapped or compliance-reviewed one does anyway, and a
      # moving tag on the artefact whose whole point is being verifiable is a way
      # to be surprised by what is running.
      - "{{ .Tag }}-oss"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
