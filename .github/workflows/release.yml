name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update_release_draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          config-name: release_template.yml
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # On a tag push, release-drafter defaults the release target_commitish
          # to the tag ref, which GitHub rejects ("not supported as release
          # target, falling back to default branch"). Point it at the default
          # branch explicitly — the same value the fallback already used.
          commitish: ${{ github.event.repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: update_release_draft
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Curated breaking-change callout. The committed .github/UPGRADE_NOTES.md
      # is a placeholder (HTML comment only); a maintainer fills it with
      # migration prose for a breaking release and clears it back afterwards.
      # When it has real content, prepend it as an "Upgrade Notes" section above
      # the release-drafter changelog in the draft body. GoReleaser below
      # publishes that draft verbatim (use_existing_draft + changelog.disable),
      # so this must run before it.
      - name: Prepend upgrade notes to release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(perl -0777 -pe 's/<!--.*?-->//gs' .github/UPGRADE_NOTES.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "UPGRADE_NOTES.md has no content; nothing to prepend."
            exit 0
          fi
          BODY=$(gh release view "$TAG" --json body --jq '.body // ""')
          {
            echo "## ⚠️ Upgrade Notes"
            echo ""
            printf '%s\n' "$NOTES" | sed -e 's/[[:space:]]*$//' -e '/./,$!d'
            echo ""
            printf '%s\n' "$BODY"
          } > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
          echo "Prepended upgrade notes to $TAG."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # >= v2.12: dockers_v2 (replaces dockers/docker_manifests).
          # homebrew_casks needs >= v2.10.
          version: '~> v2.12'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          # Force goreleaser to use the pushed tag rather than `git describe`,
          # which is non-deterministic when two tags point at the same commit
          # (e.g. promoting v1.1.0-rc1 to v1.1.0). Without this, the RC→GA
          # promotion fails because goreleaser tries to re-publish the RC.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
