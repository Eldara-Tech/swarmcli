name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the integration pipeline needs to run; the integration job
  # gates on this output. Filtering at the job level (not the workflow trigger)
  # keeps a "skipped" status on the PR so branch-protection required checks
  # remain satisfied.
  changes:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.f.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            integration:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.release'
              - 'docker-compose.yaml'
              - 'test-setup/**'
              - 'integration-tests/**'
              - 'scripts/**'
              - '.github/workflows/integration-tests.yml'

  integration:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    name: Run integration tests
    runs-on: ubuntu-latest

    # No `services:` DinD and no DOCKER_HOST override: a single shared DinD
    # container plus `docker swarm init` shadowed the multinode topology —
    # `test-setup/docker-compose.yml` (manager + scaled `worker` replicas,
    # all `privileged: true`) was run *nested* inside it, so every test and
    # the worker-readiness gate talked to the outer single-node swarm while
    # the real multinode swarm was orphaned (CI was silently single-node).
    # Run the compose stack directly on the runner's Docker, exactly as a
    # local `testenv.sh` run does: the compose `manager` publishes
    # 22375:2375 so localhost:22375 is the manager and the workers join it.
    env:
      CI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Verify Docker & Go
        run: |
          docker version
          go version

      - name: Setup Swarm
        run: bash test-setup/testenv.sh up && bash test-setup/testenv.sh deploy

      - name: Run full integration pipeline
        run: bash test-setup/testenv.sh test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: /tmp/test-report.xml

  # The locked-swarm test autolocks and restarts its own throwaway dind daemon,
  # so it must stay isolated from the shared multi-node swarm above. It is gated
  # behind the dedicated `integration_locked` build tag and needs no compose
  # bring-up, so it runs as its own job for a clean, independent signal.
  locked-swarm:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    name: Run locked-swarm integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker & Go
        run: |
          docker version
          go version

      - name: Run locked-swarm integration test
        run: go test -tags=integration_locked -count=1 -v -timeout=15m ./integration-tests/...

  # The ssh-context test stands up its own dind running an sshd and redirects
  # HOME so the ssh client config and the Docker context store are both under
  # test control. Like locked-swarm it must stay away from the shared swarm, so
  # it gets the dedicated `integration_ssh` tag and its own job.
  #
  # It cannot ride along with the regular integration job: that job's tests share
  # one HOME, and rewriting it mid-run would move the Docker context store out
  # from under them.
  ssh-context:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    name: Run ssh-context integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker, Go & ssh
        run: |
          docker version
          go version
          ssh -V

      - name: Run ssh-context integration test
        run: go test -tags=integration_ssh -count=1 -v -timeout=15m ./integration-tests/...
